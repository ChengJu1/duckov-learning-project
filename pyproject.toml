[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "duckov-learning-project"
version = "0.1.0"
description = "A small extraction-game learning project built with Python."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pygame-ce==2.5.8",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[project.scripts]
duckov-game = "duckov_game.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
